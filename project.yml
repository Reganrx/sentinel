name: SentinelBase
options:
  bundleIdPrefix: uk.co.sentinel
  deploymentTarget:
    iOS: "17.0"
packages:
  WebRTC:
    url: https://github.com/Reganrx/WebRTC.git
    exactVersion: 151.0.0
targets:
  SentinelBase:
    type: application
    platform: iOS
    sources: [SentinelBase]
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.sentinel.base
        MARKETING_VERSION: 1.2.1
        CURRENT_PROJECT_VERSION: 8
        DEVELOPMENT_TEAM: 9G2H3DAXFZ
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sentinel
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Sentinel uses your location for navigation, weather and nearby places.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Sentinel uses the microphone only when you start voice control.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Protect Sentinel settings and sensitive actions.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Sentinel uses your local network to transfer files directly between your paired devices.
        INFOPLIST_KEY_NSCameraUsageDescription: Sentinel uses the camera when you choose to attach a photo to Sentinel AI.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Sentinel converts your speech into commands and chat messages.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
