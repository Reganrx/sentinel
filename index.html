    <title>Sentinel</title>
    <style>
      html,body,#root{width:100%;height:100%;margin:0;background:#030914}
      .sentinel-instant-boot{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;color:#dffbff;font-family:Inter,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 45%,#0a3552 0%,#071326 36%,#030914 100%)}
      .sentinel-instant-boot:before{content:"";position:absolute;inset:-20%;opacity:.28;background-image:linear-gradient(rgba(87,214,255,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(87,214,255,.11) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle,#000 0%,transparent 64%);animation:instant-grid 22s linear infinite}
      .instant-boot-scan{position:absolute;width:min(70vw,640px);height:1px;background:linear-gradient(90deg,transparent,#93f0ff,transparent);box-shadow:0 0 18px #36cfff;animation:instant-scan .72s ease-in-out infinite}
      .instant-boot-core{position:relative;width:180px;aspect-ratio:1;border:1px solid rgba(100,224,255,.35);border-radius:50%;box-shadow:inset 0 0 45px rgba(50,190,255,.2),0 0 40px rgba(50,190,255,.2);animation:instant-core 1.05s linear infinite}
      .instant-boot-core:before,.instant-boot-core:after{content:"";position:absolute;border-radius:50%;border:1px dashed rgba(125,230,255,.32)}.instant-boot-core:before{inset:18px}.instant-boot-core:after{inset:48px;box-shadow:0 0 24px rgba(75,212,255,.32)}
      .instant-boot-dot{position:absolute;top:7px;left:84px;width:11px;height:11px;border-radius:50%;background:#eaffff;box-shadow:0 0 18px 6px #43d8ff}
      .instant-boot-copy{position:absolute;top:calc(50% + 125px);display:grid;gap:10px;text-align:center}.instant-boot-copy span{color:#70dffa;font-size:11px;font-weight:800;letter-spacing:.24em}.instant-boot-copy strong{color:#fff;font-size:18px;letter-spacing:.16em;text-shadow:0 0 20px rgba(97,224,255,.65)}
      @keyframes instant-grid{to{transform:translate(46px,46px)}}@keyframes instant-core{to{transform:rotate(360deg)}}@keyframes instant-scan{0%,100%{transform:translateY(-52px);opacity:.2}50%{transform:translateY(52px);opacity:1}}
      @media(prefers-reduced-motion:reduce){.sentinel-instant-boot *,.sentinel-instant-boot:before{animation:none!important}}
    </style>
