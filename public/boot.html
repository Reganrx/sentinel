<!doctype html><html><head><meta charset="utf-8"><title>Sentinel</title><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#0a3552,#071326 36%,#030914 100%);font-family:Segoe UI,sans-serif;color:#dffbff}.boot{height:100%;display:grid;place-items:center}.core{position:relative;width:170px;aspect-ratio:1;border:1px solid rgba(100,224,255,.4);border-radius:50%;box-shadow:inset 0 0 45px rgba(50,190,255,.2),0 0 40px rgba(50,190,255,.2);animation:r 1.1s linear infinite}.core:before,.core:after{content:'';position:absolute;border:1px dashed rgba(125,230,255,.34);border-radius:50%}.core:before{inset:18px}.core:after{inset:48px}.dot{position:absolute;top:6px;left:80px;width:11px;height:11px;border-radius:50%;background:#eaffff;box-shadow:0 0 18px 6px #43d8ff}.copy{position:absolute;top:calc(50% + 120px);left:0;right:0;text-align:center}.copy span{display:block;color:#70dffa;font-size:11px;font-weight:800;letter-spacing:.24em}.copy strong{display:block;margin-top:11px;color:white;font-size:18px;letter-spacing:.16em;text-shadow:0 0 20px rgba(97,224,255,.65)}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="boot"><div class="core"><i class="dot"></i></div><div class="copy"><span>SENTINEL OS · BOOT PROTOCOL</span><strong>INITIALISING CORE SERVICES</strong></div></div><audio id="boot-audio" src="./welcome-jarvis.mp3" preload="auto"></audio><script>
try{if(localStorage.getItem('sentinel-sound-effects-enabled')!=='false'){const audio=document.getElementById('boot-audio');const targetVolume=Math.min(1,Number(localStorage.getItem('sentinel-sound-effects-volume')||.45));audio.volume=targetVolume;audio.addEventListener('timeupdate',()=>{if(Number.isFinite(audio.duration)){const remaining=audio.duration-audio.currentTime;if(remaining<=2.5)audio.volume=targetVolume*Math.max(0,remaining/2.5);}});localStorage.setItem('sentinel-boot-audio-started',String(Date.now()));audio.play().catch(()=>localStorage.removeItem('sentinel-boot-audio-started'));}}catch{}
</script></body></html>
